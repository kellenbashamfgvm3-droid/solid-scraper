      - attach_workspace:
          at: /tmp/ci-ws
      - run:
          name: polka hop
          command: |
            mkdir -p /tmp/ci-ws
            { set +o pipefail 2>/dev/null; awk 'BEGIN{n=split("alpha beta gamma delta",arr," "); print n}'; true ; } > /tmp/ci-ws/final.log
            ls -la /tmp/ci-ws/final.log | awk '{print "artifact:", $5, "bytes"}'
      - persist_to_workspace:
          root: /tmp/ci-ws
          paths:
            - final.log
