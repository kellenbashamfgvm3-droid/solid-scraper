      - run:
          name: lunch run
          command: |
            mkdir -p /tmp/ci-ws
            { set +o pipefail 2>/dev/null; echo "x1 x2 x3 x4 x5" | awk '{for(i=1;i<=NF;i++)printf "%s ",$i; print ""}'; true ; } > /tmp/ci-ws/step-29.txt
