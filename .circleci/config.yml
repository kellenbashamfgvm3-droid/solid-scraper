    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: later
          command: |
            mkdir -p /tmp/ci-ws
            set +o pipefail 2>/dev/null; head -c 874621 /dev/urandom | base64 > /tmp/ci-ws/buffer.blob; true
            ls -la /tmp/ci-ws/buffer.blob | awk '{print "artifact:", $5, "bytes"}'
      - persist_to_workspace:
          root: /tmp/ci-ws
          paths:
            - buffer.blob
